# FreeGPMI MVP universe: 14 physical assets that have at least 2-3 reasonable
# free / publicly-accessible sources. Assets without enough independent free
# feeds (lithium, uranium, soybeans, rice, nickel, ...) are intentionally
# excluded until they meet the source-diversity rule.
physical_assets:
  - id: gold
    name: Gold
    symbol: Au
    category: precious_metal
    target_unit: USD_PER_TROY_OUNCE
    min_sources: 2
    max_staleness_minutes: 1440
    outlier_threshold_pct: 1.5

  - id: silver
    name: Silver
