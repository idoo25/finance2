# KEYLESS, FREE source lists. Every source here works with NO API key:
#   * stooq  - free CSV quotes (commodities, metals, FX)
#   * yahoo  - free Yahoo Finance chart API (commodities, metals, FX)
#   * ecb / frankfurter - central-bank reference FX (keyless)
# Each asset has 2 independent providers (Stooq + Yahoo) across 2 regions.
# In MVP mode (GPMI_USE_MOCK=1, default) the mock CSV adapter serves all of
# these offline; set GPMI_USE_MOCK=0 to pull live keyless data.
sources:
  gold:
    - {id: stooq_gold,       adapter: stooq, region: PL, type: delayed}
    - {id: yahoo_gold,       adapter: yahoo, region: US, type: delayed}
  silver:
    - {id: stooq_silver,     adapter: stooq, region: PL, type: delayed}
    - {id: yahoo_silver,     adapter: yahoo, region: US, type: delayed}
  platinum:
    - {id: stooq_platinum,   adapter: stooq, region: PL, type: delayed}
    - {id: yahoo_platinum,   adapter: yahoo, region: US, type: delayed}
  palladium:
    - {id: stooq_palladium,  adapter: stooq, region: PL, type: delayed}
    - {id: yahoo_palladium,  adapter: yahoo, region: US, type: delayed}
  copper:
    - {id: stooq_copper,     adapter: stooq, region: PL, type: delayed}
    - {id: yahoo_copper,     adapter: yahoo, region: US, type: delayed}
  aluminum:
    - {id: stooq_aluminum,   adapter: stooq, region: PL, type: delayed}
    - {id: yahoo_aluminum,   adapter: yahoo, region: US, type: delayed}
  wti:
    - {id: stooq_wti,        adapter: stooq, region: PL, type: delayed}
    - {id: yahoo_wti,        adapter: yahoo, region: US, type: delayed}
  brent:
    - {id: stooq_brent,      adapter: stooq, region: PL, type: delayed}
    - {id: yahoo_brent,      adapter: yahoo, region: US, type: delayed}
  natural_gas:
    - {id: stooq_natgas,     adapter: stooq, region: PL, type: delayed}
    - {id: yahoo_natgas,     adapter: yahoo, region: US, type: delayed}
  wheat:
    - {id: stooq_wheat,      adapter: stooq, region: PL, type: delayed}
    - {id: yahoo_wheat,      adapter: yahoo, region: US, type: delayed}
  corn:
    - {id: stooq_corn,       adapter: stooq, region: PL, type: delayed}
    - {id: yahoo_corn,       adapter: yahoo, region: US, type: delayed}
  cotton:
    - {id: stooq_cotton,     adapter: stooq, region: PL, type: delayed}
    - {id: yahoo_cotton,     adapter: yahoo, region: US, type: delayed}
  sugar:
    - {id: stooq_sugar,      adapter: stooq, region: PL, type: delayed}
    - {id: yahoo_sugar,      adapter: yahoo, region: US, type: delayed}
  coffee:
    - {id: stooq_coffee,     adapter: stooq, region: PL, type: delayed}
    - {id: yahoo_coffee,     adapter: yahoo, region: US, type: delayed}

# FX sources shared across all currency pairs (all keyless).
fx_sources:
  - {id: ecb,          adapter: ecb,         region: EU, type: official}
  - {id: frankfurter,  adapter: frankfurter, region: EU, type: api}
  - {id: stooq_fx,     adapter: stooq,       region: PL, type: delayed}
  - {id: yahoo_fx,     adapter: yahoo,       region: US, type: delayed}
