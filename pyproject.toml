[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freegpmi"
version = "0.1.0"
description = "Free-source, decentralized global market index (physical assets vs. major currencies)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "SQLAlchemy>=2.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["gpmi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
